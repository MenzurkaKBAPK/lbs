[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lbs-language"
version = "0.1.0"
description = "An educational programming language and virtual machine"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.package-data]
lbs = ["assets/*"]
